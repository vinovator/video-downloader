# No build step: GitHub Pages serves this repo exactly as committed. CI checks
# the helper's security boundary (the link parser and the option allowlist, and that
# the page's copy of the parser still matches), that the helper accepts every option
# the page can build, and that the page's scripts parse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Helper self-test
        run: node helper.mjs --self-test

      - name: Page options against the allowlist
        run: node tests/page.test.mjs

      - name: Page scripts parse
        run: |
          node -e 'const fs = require("fs"); const html = fs.readFileSync("index.html", "utf8"); [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].forEach((m, i) => fs.writeFileSync("page-" + i + ".js", m[1]));'
          for f in page-*.js; do node --check "$f" || exit 1; done
