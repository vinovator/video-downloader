# No build step: GitHub Pages serves this repo exactly as committed. CI checks
# the helper's security boundary (the link parser and the option allowlist, and that
# the page's copy of the parser still matches), and that the page's script parses.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Helper self-test
        run: node helper.mjs --self-test

      - name: Page script parses
        run: |
          node -e 'const fs = require("fs"); const html = fs.readFileSync("index.html", "utf8"); fs.writeFileSync("page.js", [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].at(-1)[1]);'
          node --check page.js
